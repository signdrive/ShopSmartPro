<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>__MSG_extensionName__ - __MSG_sidePanelTitle__</title>
    <link rel="stylesheet" href="sidepanel.css">
    <script src="../utils/i18n-fix.js"></script>
</head>
<body class="light-mode">
    <div class="container">
        <!-- Header -->
        <div class="header">
            <span class="current-country" id="currentCountry">🇺🇸</span>
            <h2>__MSG_extensionName__</h2>
            <div class="header-buttons">
                <!-- Updated Help Button with Image -->
                <button class="icon-btn" id="popupHelpButton" title="__MSG_getHelpAndUserGuide__">
                    <img src="../img/ebay/question-mark.png" alt="__MSG_helpAlt__" width="24" height="24">
                </button>
                <!-- Updated Settings Button with Image -->
                <button class="icon-btn" id="settingsButton" title="__MSG_openExtensionSettings__">
                    <img src="../img/ebay/settings-gear.png" alt="__MSG_settingsAlt__" width="24" height="24">
                </button>
            </div>
        </div>

        <!-- Quick Actions (Updated with Image Buttons) -->
        <div class="quick-actions">
            <button class="icon-btn" id="voiceSearchBtn" title="__MSG_voiceSearch__">
                <img src="/img/ebay/microphone-icon.png" alt="__MSG_microphoneAlt__" width="24" height="24">
            </button>
            <button class="icon-btn" id="dealsBtn" title="__MSG_deals__">
                <img src="/img/ebay/deals.png" alt="__MSG_dealsAlt__" width="24" height="24">
            </button>
            <button class="icon-btn" id="compareBtn" title="__MSG_comparison__">
                <img src="/img/ebay/comparision.png" alt="__MSG_compareAlt__" width="24" height="24">
            </button>
            <!--  New: Tracked Products Button -->
            <button class="icon-btn" id="trackedBtn" title="__MSG_trackedProducts__">
                <img src="/img/ebay/tracked.png" alt="__MSG_trackedAlt__" width="24" height="24">
            </button>
            <!--  New: eBay Button with Image -->
            <button class="icon-btn" id="searchEbayBtn" title="__MSG_searchEbay__">
                <img src="/img/ebay/ebay-button.png" alt="__MSG_searchEbay__" width="24" height="24">
            </button>
        </div>

        <!-- Search Form -->
        <form class="search-form" id="searchForm" novalidate>
            <!-- Hidden inputs -->
            <input type="hidden" name="country" id="country" value="com">

            <!-- Category Select -->
            <div class="form-group">
                <label for="categorySelect">__MSG_category__</label>
                <select name="url" id="categorySelect" class="mobile-friendly">
                    <option value="search-alias=aps">__MSG_categoryAllDepartments__</option>
                    <option value="search-alias=alexa-skills">__MSG_categoryAlexaSkills__</option>
                    <option value="search-alias=amazon-devices">__MSG_categoryAmazonDevices__</option>
                    <option value="search-alias=warehouse-deals">__MSG_categoryAmazonWarehouseDeals__</option>
                    <option value="search-alias=mobile-apps">__MSG_categoryAppsGames__</option>
                    <option value="search-alias=automotive">__MSG_categoryAutomotive__</option>
                    <option value="search-alias=baby">__MSG_categoryBaby__</option>
                    <option value="search-alias=beauty">__MSG_categoryBeauty__</option>
                    <option value="search-alias=apparel">__MSG_categoryClothingAccessories__</option>
                    <option value="search-alias=stripbooks">__MSG_categoryBooks__</option>
                    <option value="search-alias=electronics">__MSG_categoryElectronics__</option>
                    <option value="search-alias=gift-cards">__MSG_categoryGiftCards__</option>
                    <option value="search-alias=grocery">__MSG_categoryGrocery__</option>
                    <option value="search-alias=handmade">__MSG_categoryHandmade__</option>
                    <option value="search-alias=hpc">__MSG_categoryHealthPersonalCare__</option>
                    <option value="search-alias=kitchen">__MSG_categoryHomeKitchen__</option>
                    <option value="search-alias=industrial">__MSG_categoryIndustrialScientific__</option>
                    <option value="search-alias=jewelry">__MSG_categoryJewelry__</option>
                    <option value="search-alias=digital-text">__MSG_categoryKindleStore__</option>
                    <option value="search-alias=french-books">__MSG_categoryLivresEnFrancais__</option>
                    <option value="search-alias=luggage">__MSG_categoryLuggageBags__</option>
                    <option value="search-alias=luxury-beauty">__MSG_categoryLuxuryBeauty__</option>
                    <option value="search-alias=dvd">__MSG_categoryMoviesTV__</option>
                    <option value="search-alias=popular">__MSG_categoryMusic__</option>
                    <option value="search-alias=mi">__MSG_categoryMusicalInstruments__</option>
                    <option value="search-alias=office-products">__MSG_categoryOfficeProducts__</option>
                    <option value="search-alias=lawngarden">__MSG_categoryPatioLawnGarden__</option>
                    <option value="search-alias=pets">__MSG_categoryPetSupplies__</option>
                    <option value="search-alias=shoes">__MSG_categoryShoesHandbags__</option>
                    <option value="search-alias=software">__MSG_categorySoftware__</option>
                    <option value="search-alias=sporting">__MSG_categorySportsOutdoors__</option>
                    <option value="search-alias=tools">__MSG_categoryToolsHomeImprovement__</option>
                    <option value="search-alias=toys">__MSG_categoryToysGames__</option>
                    <option value="search-alias=videogames">__MSG_categoryVideoGames__</option>
                    <option value="search-alias=watches">__MSG_categoryWatches__</option>
                </select>
            </div>

            <!-- Keywords Input -->
            <div class="form-group">
                <label for="searchInput">__MSG_keywords__</label>
                <input 
                    type="text" 
                    name="keyword" 
                    id="searchInput" 
                    placeholder="__MSG_whatAreYouLookingFor__" 
                    autocomplete="off"
                    class="mobile-friendly">
            </div>

            <!-- Advanced Filters -->
            <div class="advanced-options">
                <label class="checkbox-label">
                    <input type="checkbox" id="primeOnly">
                    <span class="checkmark"></span>
                    __MSG_primeOnly__
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="freeShipping">
                    <span class="checkmark"></span>
                    __MSG_freeShipping__
                </label>
            </div>

            <!-- Submit Button (Updated with Image) -->
            <button type="submit" class="search-btn" id="searchButton">
                <img src="/img/ebay/amazon-search-icon.png" alt="__MSG_searchAlt__" class="btn-icon">
                __MSG_searchStore__
            </button>
        </form>

        <!-- Recent Searches -->
        <div class="recent-searches" id="recentSearchesSection">
            <h4>__MSG_recentSearches__</h4>
            <div class="search-history" id="searchHistory"></div>
            <button id="clearHistoryBtn" class="clear-history-btn">__MSG_clearHistory__</button>
        </div>

        <!-- Quick Stats -->
        <div class="quick-stats">
            <div class="stat-item">
                <span class="stat-label">__MSG_todaysSearchesLabel__</span>
                <span class="stat-value" id="todaySearches">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">__MSG_activeTrackersLabel__</span>
                <span class="stat-value" id="activeTrackers">0</span>
            </div>
        </div>

        <!-- Tracked Products Section (Additional for Side Panel) -->
        <div class="tracked-products-section" id="trackedProductsSection">
            <h4>__MSG_trackedProductsSection__</h4>
            <div class="tracked-products-list" id="trackedProductsList">
                <div class="empty-state">__MSG_noProductsTracked__</div>
            </div>
        </div>

        <!-- Comparison Products Section (Additional for Side Panel) -->
        <div class="comparison-section" id="comparisonSection">
            <h4>__MSG_comparison__</h4>
            <div class="comparison-list" id="comparisonList">
                <div class="empty-state">__MSG_noProductsInComparison__</div>
            </div>
        </div>
    </div>

    <!-- Voice Search Modal -->
    <div class="voice-search-modal" id="voiceSearchModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>__MSG_voiceSearchTitle__</h3>
                <button class="close-modal" id="closeVoiceModal">×</button>
            </div>
            <div class="modal-body">
                <div class="voice-status" id="voiceStatus">__MSG_voiceStatusInit__</div>
                <button class="voice-btn" id="startVoiceBtn">🎤 __MSG_startListeningBtn__</button>
                <div class="voice-result" id="voiceResult"></div>
            </div>
        </div>
    </div>

    <!-- Script -->
    <script src="sidepanel.js"></script>
</body>
</html>
