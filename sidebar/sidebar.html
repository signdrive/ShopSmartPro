<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSmart Pro</title>
    <link rel="stylesheet" href="sidebar.css">
</head>
<body class="light-mode">
    <div class="container">
        <!-- Header -->
        <div class="header">
            <span class="current-country" id="currentCountry">🇺🇸</span>
            <h2>ShopSmart Pro</h2>
            <div class="header-buttons">
                <button class="icon-btn" id="popupHelpButton" data-tooltip="Get help and user guide">
                    <img src="../img/ebay/question-mark.png" alt="Help">
                </button>
                <button class="icon-btn" id="settingsButton" data-tooltip="Open extension settings">
                    <img src="../img/ebay/settings-gear.png" alt="Settings">
                </button>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <button class="icon-btn" id="voiceSearchBtn" data-tooltip="Search using your voice">
                <img src="../img/ebay/microphone-icon.png" alt="Voice Search">
            </button>
            <button class="icon-btn" id="dealsBtn" data-tooltip="Browse today's top deals">
                <img src="../img/ebay/deals.png" alt="Deals">
            </button>
            <button class="icon-btn" id="compareBtn" data-tooltip="Compare products side-by-side">
                <img src="../img/ebay/comparision.png" alt="Compare">
            </button>
            <button class="icon-btn" id="trackedBtn" data-tooltip="View your tracked price history">
                <img src="../img/ebay/tracked.png" alt="Tracked">
            </button>
            <button class="icon-btn" id="searchEbayBtn" data-tooltip="Search for products on eBay">
                <img src="../img/ebay/ebay-button.png" alt="Search eBay">
            </button>
        </div>

        <!-- Search Form -->
        <form class="search-form" id="searchForm" novalidate>
            <input type="hidden" name="country" id="country" value="com">
            <div class="form-group">
                <label for="categorySelect">Category:</label>
                <select name="url" id="categorySelect" class="mobile-friendly">
                    <option value="search-alias=aps">All Departments</option>
                    <option value="search-alias=alexa-skills">Alexa Skills</option>
                    <option value="search-alias=amazon-devices">Amazon Devices</option>
                    <option value="search-alias=warehouse-deals">Amazon Warehouse Deals</option>
                    <option value="search-alias=mobile-apps">Apps & Games</option>
                    <option value="search-alias=automotive">Automotive</option>
                    <option value="search-alias=baby">Baby</option>
                    <option value="search-alias=beauty">Beauty</option>
                    <option value="search-alias=apparel">Clothing & Accessories</option>
                    <option value="search-alias=stripbooks">Books</option>
                    <option value="search-alias=electronics">Electronics</option>
                    <option value="search-alias=gift-cards">Gift Cards</option>
                    <option value="search-alias=grocery">Grocery</option>
                    <option value="search-alias=handmade">Handmade</option>
                    <option value="search-alias=hpc">Health & Personal Care</option>
                    <option value="search-alias=kitchen">Home & Kitchen</option>
                    <option value="search-alias=industrial">Industrial & Scientific</option>
                    <option value="search-alias=jewelry">Jewelry</option>
                    <option value="search-alias=digital-text">Kindle Store</option>
                    <option value="search-alias=french-books">Livres en français</option>
                    <option value="search-alias=luggage">Luggage & Bags</option>
                    <option value="search-alias=luxury-beauty">Luxury Beauty</option>
                    <option value="search-alias=dvd">Movies & TV</option>
                    <option value="search-alias=popular">Music</option>
                    <option value="search-alias=mi">Musical Instruments</option>
                    <option value="search-alias=office-products">Office Products</option>
                    <option value="search-alias=lawngarden">Patio, Lawn & Garden</option>
                    <option value="search-alias=pets">Pet Supplies</option>
                    <option value="search-alias=shoes">Shoes & Handbags</option>
                    <option value="search-alias=software">Software</option>
                    <option value="search-alias=sporting">Sports & Outdoors</option>
                    <option value="search-alias=tools">Tools & Home Improvement</option>
                    <option value="search-alias=toys">Toys & Games</option>
                    <option value="search-alias=videogames">Video Games</option>
                    <option value="search-alias=watches">Watches</option>
                </select>
            </div>
            <div class="form-group">
                <input type="text" id="searchInput" placeholder="Search Amazon..." autofocus>
            </div>
            <div class="advanced-options">
                <label class="checkbox-label">
                    <input type="checkbox" id="primeOnly"> Prime Only
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="freeShipping"> Free Shipping
                </label>
            </div>
            <button type="submit" class="search-btn">
                🔍 Search Store
            </button>
        </form>

        <!-- Recent Searches -->
        <div class="recent-searches">
            <h4>🕒 Recent Searches</h4>
            <div class="search-history" id="searchHistory">
                <!-- Filled by JS -->
            </div>
            <button class="clear-history-btn" id="clearHistoryBtn">Clear</button>
        </div>

        <!-- Quick Stats -->
        <div class="quick-stats">
            <div class="stat-item">
                <span class="stat-label">Today's Searches</span>
                <span class="stat-value" id="todaySearches">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Active Trackers</span>
                <span class="stat-value" id="activeTrackers">0</span>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <span class="current-settings" id="currentSettings">US | All</span>
        </footer>
    </div>

    <!-- Voice Search Modal -->
    <div id="voiceSearchModal" class="voice-search-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🎤 Voice Search</h3>
                <button id="closeVoiceModal" class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="voice-status" id="voiceStatus">Click "Start Listening" to begin.</div>
                <button id="startVoiceBtn" class="voice-btn">🎤 Start Listening</button>
                <div class="voice-result" id="voiceResult"></div>
            </div>
        </div>
    </div>

    <script src="sidebar.js"></script>
</body>
</html>
