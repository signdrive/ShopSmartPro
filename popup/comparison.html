<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🛒 Product Comparison - ShopSmart Pro</title>
    <link rel="stylesheet" href="comparison.css" />
    <!-- Prevent CSP warnings -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none';">
</head>
<body class="light-mode">
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🛒 Product Comparison</h1>
            <p class="subtitle">Compare prices, ratings, and features at a glance</p>
        </header>

        <!-- Results Grid -->
        <main id="comparisonResults" class="results">
            <!-- Will be filled by comparison.js -->
            <div class="empty-state">
                <p>🔍 No products added yet.</p>
                <p class="hint">Click “Compare” on any product listing to add items here.</p>
            </div>
        </main>

        <!-- Action Footer -->
        <footer class="actions">
            <!-- Load Saved List -->
            <div class="saved-lists-control">
                <label for="loadList" class="sr-only">Load a saved comparison</label>
                <select id="loadList" class="load-list-select" aria-label="Select a saved list">
                    <option value="">💾 Load Saved Comparison</option>
                </select>
                <button id="deleteList" class="btn btn-danger btn-sm" title="Delete selected list">🗑️</button>
            </div>

            <!-- Save List -->
            <input 
                type="text" 
                id="listName" 
                placeholder="e.g., My Home Office Setup" 
                class="save-list-input" 
                aria-label="Name this comparison list"
            />

            <!-- Buttons -->
            <button id="saveList" class="btn btn-primary btn-block">💾 Save List</button>
            <button id="exportCsv" class="btn btn-secondary btn-block">📤 Export to CSV</button>
            <button id="shareBtn" class="btn btn-secondary btn-block">🔗 Share Link</button>
            <button id="clearComparison" class="btn btn-danger btn-block">🗑️ Clear All</button>
            <button id="closeComparison" class="btn btn-primary btn-block">✕ Close</button>
        </footer>
    </div>

    <!-- External JS (CSP-compliant) -->
    <script src="comparison.js"></script>
</body>
</html>
