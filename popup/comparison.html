<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__MSG_productComparisonTitle__</title>
    <link rel="stylesheet" href="comparison.css" />
    <!-- Prevent CSP warnings -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none';">
</head>
<body class="light-mode">
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>__MSG_productComparison__</h1>
            <p class="subtitle">__MSG_comparePricesRatingsFeatures__</p>
        </header>

        <!-- Results Grid -->
        <main id="comparisonResults" class="results">
            <!-- Will be filled by comparison.js -->
            <div class="empty-state">
                <p>__MSG_noProductsAddedYet__</p>
                <p class="hint">__MSG_clickCompareToAdd__</p>
            </div>
        </main>

        <!-- Action Footer -->
        <footer class="actions">
            <!-- Load Saved List -->
            <div class="saved-lists-control">
                <label for="loadList" class="sr-only">__MSG_loadSavedComparison__</label>
                <select id="loadList" class="load-list-select" aria-label="__MSG_loadSavedComparison__">
                    <option value="">__MSG_loadSavedComparisonOption__</option>
                </select>
                <button id="deleteList" class="btn btn-danger btn-sm" title="__MSG_deleteSelectedList__">🗑️</button>
            </div>

            <!-- Save List -->
            <input 
                type="text" 
                id="listName" 
                placeholder="__MSG_listNamePlaceholder__" 
                class="save-list-input" 
                aria-label="__MSG_nameThisComparisonList__"
            />

            <!-- Buttons -->
            <button id="saveList" class="btn btn-primary btn-block">__MSG_saveList__</button>
            <button id="exportCsv" class="btn btn-secondary btn-block">__MSG_exportToCsv__</button>
            <button id="shareBtn" class="btn btn-secondary btn-block">__MSG_shareLink__</button>
            <button id="clearComparison" class="btn btn-danger btn-block">__MSG_clearAll__</button>
            <button id="closeComparison" class="btn btn-primary btn-block">__MSG_close__</button>
        </footer>
    </div>

    <!-- External JS (CSP-compliant) -->
    <script src="comparison.js"></script>
</body>
</html>
