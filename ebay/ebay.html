<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📦 eBay Search - ShopSmart Pro</title>
  <link rel="stylesheet" href="ebay.css" />
  <!-- Prevent CSP warnings -->
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none';">
</head>
<body class="">
  <!-- Default: light mode (no class), dark-mode added by JS -->
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>📦 eBay Search</h1>
      <p class="subtitle">Find deals across eBay with affiliate tracking</p>
      
    </header>

    <!-- Search Form -->
    <form id="searchForm" class="search-box" novalidate>
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Search on eBay..." 
        autofocus
      />
      <button type="submit" id="searchBtn" class="btn btn-primary">🔍 Search</button>
    </form>

    <!-- Action Controls -->
    <div class="action-controls">
      <button id="clearSearch" class="btn btn-secondary">🗑️ Clear</button>
      <button id="closeBtn" class="btn btn-danger">✕ Close</button>
    </div>

    <!-- Loading Indicator -->
    <div id="loading" class="loading" style="display: none;">
      <p>🔍 Searching eBay...</p>
    </div>

    <!-- Error Message -->
    <div id="error" class="error" style="display: none;"></div>

    <!-- Results Grid -->
    <main id="results" class="results-grid">
      <!-- Results injected here by ebay.js -->
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>🛒 Powered by <strong>ShopSmart Pro</strong> | Affiliate links supported</p>
    </footer>
  </div>

  <!-- External JS (CSP-compliant) -->
  <script src="ebay.js"></script>
</body>
</html>
