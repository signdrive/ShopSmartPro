<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📦 __MSG_trackedProducts__ - __MSG_extensionName__</title>
  <link rel="stylesheet" href="tracked.css">
  <script src="../utils/i18n-fix.js"></script>
</head>
<body class="light-mode">
  <div class="container">
    <!-- Header -->
    <header class="header">
  <h1>📦 __MSG_trackedProducts__</h1>
  <p class="subtitle">__MSG_getAlertsWhenPricesDrop__</p>
  <button id="closeBtn" class="btn btn-danger" aria-label="__MSG_close__">✕</button>
    </header>

    <!-- Controls -->
    <div class="controls">
      <div class="search-filter">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="__MSG_searchTrackedProducts__" 
          class="search-input"
          aria-label="__MSG_searchTrackedProducts__">
        <select id="categoryFilter" aria-label="__MSG_filterByCategory__">
          <option value="all">__MSG_allCategories__</option>
        </select>
      </div>
  <button id="exportCsvBtn" class="btn">📤 __MSG_exportToCsv__</button>
    </div>

    <!-- Results -->
    <main id="trackedResults" class="results" role="main">
  <div class="loading">__MSG_loadingTrackedProducts__</div>
    </main>

    <!-- Footer -->
    <footer class="footer">
  <p>🔔 <strong>__MSG_priceAlertsActive__</strong> | __MSG_updatesEvery6Hours__</p>
    </footer>
  </div>

  <!-- ✅ CORRECT PATHS -->
  <!-- Goes to /lib folder -->
  <script src="chart.min.js"></script>
  
  <!-- In same folder -->
  <script src="tracked.js"></script>
</body>
</html>
